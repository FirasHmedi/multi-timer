name: Android

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release build signed with the template's debug key: fine for testing, NOT for the Play Store.
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk multi-timer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: multi-timer.apk
          if-no-files-found: error

  screenshots:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # English, then French. android-widget.sh checks the home-screen widget provider.
      # The script finds tap targets with uiautomator, checks that the
      # language is applied and that a preset starts a timer, and fails if the app crashes.
      - name: Run app on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash scripts/android-screenshots.sh en multi-timer.apk screenshots/en
            bash scripts/android-widget.sh en screenshots/en
            bash scripts/android-screenshots.sh fr multi-timer.apk screenshots/fr
            bash scripts/android-widget.sh fr screenshots/fr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      # main -> android-screenshots; other pushed branches -> android-screenshots-<branch>.
      - name: Publish screenshots to a branch
        if: always() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then target=android-screenshots; else target="android-screenshots-${GITHUB_REF_NAME//\//-}"; fi
          cd screenshots
          git init -q -b "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Android emulator screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$target"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: multi-timer.apk
