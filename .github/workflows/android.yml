name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release build signed with the template's debug key: fine for testing, NOT for the Play Store.
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk multi-timer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: multi-timer.apk
          if-no-files-found: error

  screenshots:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install -r multi-timer.apk
            adb shell pm grant com.pomwik.multitimer android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p com.pomwik.multitimer -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > screenshots/01-home.png
            # Coordinates for a pixel_6 profile (1080x2400): "+" button, then the first preset.
            adb shell input tap 950 2140
            sleep 4
            adb exec-out screencap -p > screenshots/02-new-timer.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell input tap 200 380
            sleep 4
            adb exec-out screencap -p > screenshots/03-preset-started.png
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then adb logcat -d | grep -A30 "FATAL EXCEPTION"; echo "App crashed"; exit 1; fi
            adb shell dumpsys window | grep -E "mCurrentFocus" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - name: Publish screenshots to the android-screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd screenshots
          git init -q -b android-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Android emulator screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-screenshots

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: multi-timer.apk
